<div class="auth-page">
  <div class="auth-container fade-in-up">
    <div class="auth-header">
      <div class="logo">
        <i class="fas fa-graduation-cap"></i>
        <h1>EduPlatform</h1>
      </div>
      <h2 class="auth-title">{{ isLoginMode ? 'Welcome Back' : 'Join Us Today' }}</h2>
      <p class="auth-subtitle">{{ isLoginMode ? 'Sign in to continue your learning' : 'Start your learning journey' }}</p>
    </div>

    <form class="auth-form">
      <div class="form-group">
        <label for="username">
          <i class="fas fa-user"></i>
          Username
        </label>
        <input 
          id="username"
          class="form-control"
          [(ngModel)]="username" 
          name="username"
          placeholder="Enter your username"
          required>
      </div>

      <div class="form-group">
        <label for="password">
          <i class="fas fa-lock"></i>
          Password
        </label>
        <input 
          id="password"
          class="form-control"
          [(ngModel)]="password" 
          name="password"
          type="password" 
          placeholder="Enter your password"
          required>
      </div>
      
      <div class="form-group" *ngIf="!isLoginMode">
        <label for="role">
          <i class="fas fa-user-tag"></i>
          Role
        </label>
        <select id="role" class="form-control" [(ngModel)]="role" name="role">
          <option value="STUDENT">Student</option>
          <option value="INSTRUCTOR">Instructor</option>
          <option value="ADMIN">Admin</option>
        </select>
      </div>

      <button 
        type="button"
        class="btn btn-primary btn-full"
        (click)="isLoginMode ? login() : register()">
        <i class="fas" [class.fa-sign-in-alt]="isLoginMode" [class.fa-user-plus]="!isLoginMode"></i>
        {{ isLoginMode ? 'Sign In' : 'Create Account' }}
      </button>
    </form>

    <div class="auth-footer">
      <p class="toggle-link" (click)="toggleMode()">
        {{ isLoginMode ? "Don't have an account?" : 'Already have an account?' }}
        <span class="link-text">{{ isLoginMode ? 'Sign Up' : 'Sign In' }}</span>
      </p>
    </div>

    <div class="error-message" *ngIf="error">
      <i class="fas fa-exclamation-triangle"></i>
      {{ error }}
    </div>
  </div>
</div>
